name: Notify iris-web meta-repo

# Fires after the build-and-push workflow completes on develop / master / main.
# Sends a repository_dispatch to dfir-iris/iris-web so its e2e.yml workflow
# runs Playwright against the freshly-published frontend image.

on:
  workflow_run:
    workflows:
      - Build and push frontend image
    types:
      - completed
    branches:
      - develop
      - master
      - main

jobs:
  notify:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch to iris-web
        env:
          META_REPO_TOKEN: ${{ secrets.META_REPO_DISPATCH_TOKEN }}
          SOURCE_WORKFLOW: ${{ github.event.workflow_run.name }}
          SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_BRANCH: ${{ github.event.workflow_run.head_branch }}
          SOURCE_REPO: ${{ github.repository }}
        run: |
          payload=$(jq -nc \
            --arg repo "$SOURCE_REPO" \
            --arg workflow "$SOURCE_WORKFLOW" \
            --arg sha "$SOURCE_SHA" \
            --arg branch "$SOURCE_BRANCH" \
            '{event_type: "sub-repo-published", client_payload: {repo: $repo, workflow: $workflow, sha: $sha, branch: $branch}}')
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $META_REPO_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/dfir-iris/iris-web/dispatches" \
            -d "$payload"
