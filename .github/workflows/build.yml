name: Build and push frontend image

on:
  push:
    branches: [develop, master, main]
    tags: ['v*.*.*']
  pull_request:
    branches: [develop, master, main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: dfir-iris/iris-frontend

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      packages: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push scratch image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache-{2},mode=max', env.REGISTRY, env.IMAGE_NAME, matrix.arch) || '' }}
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-${{ matrix.arch }}
          push: ${{ github.event_name != 'pull_request' }}

  merge:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      packages: write
      contents: read

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check if beta tag
        id: check_beta
        env:
          REF: ${{ github.ref }}
        run: |
          if [[ "$REF" == *"beta"* ]]; then
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=${{ startsWith(github.ref, 'refs/tags/v') && steps.check_beta.outputs.is_beta != 'true' }}
          tags: |
            type=ref,event=tag
            type=semver,pattern=v{{version}}
            type=ref,event=branch
            type=raw,value=beta,enable=${{ steps.check_beta.outputs.is_beta == 'true' }}

      - name: Create manifest list and push
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-amd64 \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:ci-${{ github.sha }}-arm64

      # There is deliberately no scratch-tag cleanup step here.
      #
      # `imagetools create` above builds an index whose children are the exact
      # manifests behind ci-<sha>-amd64 and ci-<sha>-arm64. Those two
      # tags are the only handles on manifests the release tags now depend on,
      # and `oras manifest delete` / `crane delete` remove the *manifest*, not
      # just the tag — ORAS even prompts "delete the manifest and all tags
      # associated with it". So the step that used to sit here would, the first
      # time a runner happened to ship one of those binaries, have deleted the
      # platform children out from under the image it had just published:
      # `docker pull` on the tag resolves, then 404s on the arch manifest. It
      # only ever looked harmless because ubuntu-24.04 has neither binary, so it
      # printed "No registry cleanup CLI available" and exited 0 on every run.
      #
      # These tags cannot be cleaned up at this point in time by anything. They
      # are collected by the ghcr-retention workflow in iris-web, which deletes
      # a platform child only once its last parent index is gone — see the
      # reference-count gate in dataaxiom/ghcr-cleanup-action's
      # image-deleter.ts. Eliminating them entirely means switching this
      # workflow to the push-by-digest pattern so no scratch tag is ever
      # created; that is a change to the publish path, not a cleanup.
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
